name: Diagnóstico DQF (temporal)

# Solo manual. No usa DATABASE_URL ni escribe en Neon. Se puede borrar cuando ya tengamos la respuesta.
on:
  workflow_dispatch:

concurrency:
  group: diagnostico-dqf
  cancel-in-progress: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Diagnóstico de DQF y valores de relleno
        run: python scripts/diagnostico_dqf.py
